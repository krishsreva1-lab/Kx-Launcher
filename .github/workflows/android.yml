name: Android CI

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_NEXT_KEYSTORE_PASSWORD }}
      MOJOPUB_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_NEXT_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Create out directory
        run: mkdir out
      - name: Build Publishing .aab
        if: github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_kx:bundleFullGplay
          mv app_kx/build/outputs/bundle/fullGplay/app_kx-full-gplay.aab out/app-gplay.aab

      - name: Build Debug .apk
        run: |
          # Build the launcher
          gradle :app_kx:assembleFullDebug
          mv app_kx/build/outputs/apk/full/debug/app_kx-full-debug.apk out/app-debug-full.apk

      - name: Build Debug .apk (No runtime)
        run: |
          gradle :app_kx:assembleNoruntimeDebug
          mv app_kx/build/outputs/apk/noruntime/debug/app_kx-noruntime-debug.apk out/app-debug-noruntime.apk
      - name: Build Nightly Release .apk
        if: github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_kx:assembleFullPubRelease
          mv app_kx/build/outputs/apk/full/pubRelease/app_kx-full-pubRelease.apk out/app-release.apk
      - name: Gen md5sums
        run: |
          md5sum out/app-debug-full.apk > out/app-debug-full.md5
          md5sum out/app-debug-noruntime.apk > out/app-debug-noruntime.md5

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: out/app-debug-full.apk

      - name: Upload Debug APK (No runtime)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-noruntime
          path: out/app-debug-noruntime.apk

      - name: Release Nightly APK
        if: github.ref_name == 'v3_openjdk'
        uses: softprops/action-gh-release@v3
        with:
          name: Nightly Builds
          prerelease: true
          tag_name: nightly
          body: |
            Nightly build.
            Commit hash: ${{ github.sha }}
          files: |
            out/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: out/app-gplay.aab

      - name: Upload onto the Google Play testing track
        continue-on-error: true
        if: github.ref_name == 'v3_openjdk'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_JSON }}
          packageName: git.artdeell.mjlaunch
          releaseFiles: out/app-gplay.aab
          track: internal
          inAppUpdatePriority: 5
